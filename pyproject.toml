[project]
name = "atlas-g"
version = "0.1.0"
description = "Field Ops Assistant — Stateful AI agent for field technicians using Docling, Granite, LangGraph, Redis, Kokoro TTS, and Whisper STT."
authors = [
    { name = "Aparna Pradhan", email = "138992224+Aparnap2@users.noreply.github.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    # Core LLM & Orchestration
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-redis>=0.1.0",

    # Document Parsing
    "docling>=2.5.0",

    # Vector Store & Embeddings
    "faiss-cpu>=1.8.0",

    # Redis
    "redis>=5.0.0",

    # UI
    "streamlit>=1.35.0",

    # TTS — Kokoro
    "kokoro>=0.9.4",
    "soundfile>=0.12.1",
    "sounddevice>=0.4.6",

    # STT — faster-whisper
    "faster-whisper>=1.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "numpy>=1.26.0",
]

[project.scripts]
atlas-g = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
